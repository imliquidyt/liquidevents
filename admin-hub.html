<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="liquidicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Events | Admin Hub</title>
  <meta name="description" content="Staff administration hub for Liquid Events.">
  <script>document.documentElement.classList.add('js');history.replaceState(null,'','/#admin-hub');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Oxanium:wght@500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260519d">
  <style>
    /* ---- Admin Hub specific styles ---- */

    /* Auth gate */
    .hub-gate {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .hub-gate-card {
      max-width: 460px;
      padding: 2.4rem;
    }
    .hub-gate-icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 1rem;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,.60));
    }

    /* 9-button grid */
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
      margin-top: 2rem;
    }
    .hub-btn {
      all: unset;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: .52rem;
      padding: 1.5rem 1.4rem;
      border-radius: 22px;
      border: 3px solid rgba(56,189,248,.34);
      background:
        linear-gradient(135deg, rgba(186,230,253,.14) 0%, transparent 32%),
        linear-gradient(315deg, rgba(0,0,0,.32) 0%, transparent 36%),
        #021628;
      box-shadow: 6px 6px 0 #000C1A;
      transition: transform .14s, box-shadow .14s, border-color .14s;
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    .hub-btn::after {
      content: "";
      position: absolute;
      left: 2px; right: 2px; top: 2px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(186,230,253,.70), rgba(94,234,212,.50), transparent);
    }
    .hub-btn:not([disabled]):hover {
      transform: translate(-3px, -4px);
      border-color: rgba(56,189,248,.70);
      box-shadow: 9px 9px 0 #000C1A;
    }
    .hub-btn:not([disabled]):active {
      transform: translate(3px, 4px);
      box-shadow: 2px 2px 0 #000C1A;
    }
    .hub-btn[disabled] {
      opacity: .42;
      cursor: not-allowed;
      border-color: rgba(56,189,248,.16);
      box-shadow: 4px 4px 0 #000C1A;
    }
    .hub-btn-icon {
      font-size: 2rem;
      line-height: 1;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,.60));
    }
    .hub-btn-title {
      font-family: "Oxanium", sans-serif;
      font-weight: 800;
      font-size: 1.0rem;
      color: #EFF8FF;
      letter-spacing: .04em;
    }
    .hub-btn-desc {
      font-size: .80rem;
      color: #5A96B8;
      line-height: 1.4;
    }
    .hub-btn-arrow {
      position: absolute;
      right: 1.2rem;
      bottom: 1.2rem;
      font-size: 1.0rem;
      color: #38BDF8;
      opacity: .60;
    }
    .hub-btn-active .hub-btn-title { color: #38BDF8; }

    /* section panel that expands below grid */
    .hub-panel {
      margin-top: 1.6rem;
      border-radius: 22px;
      border: 3px solid rgba(56,189,248,.38);
      background:
        linear-gradient(135deg, rgba(186,230,253,.10) 0%, transparent 28%),
        #010D1A;
      box-shadow: 6px 6px 0 #000C1A;
      overflow: hidden;
    }
    .hub-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      border-bottom: 2px solid rgba(56,189,248,.22);
      background: rgba(56,189,248,.05);
    }
    .hub-panel-head h2 { font-size: 1.35rem; }
    .hub-panel-body { padding: 1.5rem; }

    /* Refresh button */
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: .44rem;
      padding: .46rem .90rem;
      border-radius: 999px;
      border: 2.5px solid rgba(56,189,248,.44);
      background: #07395C;
      color: #BAE6FD;
      font-family: "Oxanium", sans-serif;
      font-weight: 800;
      font-size: .78rem;
      letter-spacing: .06em;
      cursor: pointer;
      box-shadow: 3px 3px 0 #000C1A;
      transition: transform .12s, box-shadow .12s;
    }
    .refresh-btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 #000C1A; }
    .refresh-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000C1A; }
    .refresh-btn.spinning .refresh-icon { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .refresh-icon { display: inline-block; }

    /* Loading / error states */
    .panel-loading {
      text-align: center;
      padding: 3rem 1rem;
      color: #5A96B8;
      font-family: "Oxanium", sans-serif;
      font-weight: 600;
    }
    .panel-error {
      text-align: center;
      padding: 2rem 1rem;
      color: #FCA5A5;
      font-family: "Oxanium", sans-serif;
    }

    /* ================================================================
       LEADERBOARD
       ================================================================ */
    .podium-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .podium-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .56rem;
      flex: 1;
      max-width: 220px;
      padding: 1.2rem 1rem .8rem;
      border-radius: 18px;
      border: 3px solid rgba(56,189,248,.38);
      background:
        linear-gradient(135deg, rgba(186,230,253,.16) 0%, transparent 30%),
        #021628;
      box-shadow: 5px 5px 0 #000C1A;
      text-align: center;
      position: relative;
      cursor: default;
      transition: transform .2s, box-shadow .2s;
    }
    .podium-card:hover {
      transform: translateY(-6px);
      box-shadow: 5px 11px 0 #000C1A;
    }

    /* Podium heights — 1st is tallest */
    .podium-1st { order: 2; min-height: 240px; border-color: rgba(255,215,0,.60); background: linear-gradient(135deg, rgba(255,215,0,.16) 0%, transparent 30%), #021628; }
    .podium-2nd { order: 1; min-height: 200px; }
    .podium-3rd { order: 3; min-height: 180px; }

    .podium-rank-badge {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px; height: 36px;
      border-radius: 999px;
      border: 3px solid #000C1A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Russo One", sans-serif;
      font-size: 1rem;
      box-shadow: 3px 3px 0 #000C1A;
    }
    .podium-1st .podium-rank-badge { background: #D97706; color: #000; font-size: 1.1rem; width: 42px; height: 42px; top: -20px; }
    .podium-2nd .podium-rank-badge { background: #94A3B8; color: #000; }
    .podium-3rd .podium-rank-badge { background: #92400E; color: #FDE68A; }

    .podium-crown { font-size: 1.6rem; filter: drop-shadow(0 3px 0 rgba(0,0,0,.70)); }
    .podium-1st .podium-crown { font-size: 2.2rem; }

    .podium-avatar {
      width: 72px; height: 72px;
      border-radius: 999px;
      object-fit: cover;
      border: 3px solid rgba(56,189,248,.55);
      box-shadow: 4px 4px 0 #000C1A;
      background: #021628;
    }
    .podium-1st .podium-avatar { width: 88px; height: 88px; border-color: rgba(255,215,0,.65); box-shadow: 5px 5px 0 #000C1A; }

    .podium-avatar-fallback {
      width: 72px; height: 72px;
      border-radius: 999px;
      border: 3px solid rgba(56,189,248,.55);
      background: #07395C;
      display: flex; align-items: center; justify-content: center;
      font-family: "Russo One", sans-serif;
      font-size: 1.6rem;
      color: #BAE6FD;
      box-shadow: 4px 4px 0 #000C1A;
    }
    .podium-1st .podium-avatar-fallback { width: 88px; height: 88px; font-size: 2rem; }

    .podium-name {
      font-family: "Oxanium", sans-serif;
      font-weight: 800;
      font-size: .92rem;
      color: #EFF8FF;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .podium-1st .podium-name { font-size: 1.05rem; color: #FDE68A; }

    .podium-role-badge {
      display: inline-flex;
      align-items: center;
      gap: .32rem;
      padding: .22rem .58rem;
      border-radius: 999px;
      border: 2px solid;
      font-family: "Oxanium", sans-serif;
      font-weight: 800;
      font-size: .66rem;
      letter-spacing: .06em;
      box-shadow: 2px 2px 0 #000C1A;
    }

    /* Ranked list (position 4+) */
    .lb-list { display: grid; gap: .72rem; }

    .lb-entry {
      display: flex;
      align-items: center;
      gap: .90rem;
      padding: .80rem 1rem;
      border-radius: 14px;
      border: 2.5px solid rgba(56,189,248,.22);
      background: linear-gradient(135deg, rgba(186,230,253,.08) 0%, transparent 30%), #021628;
      box-shadow: 4px 4px 0 #000C1A;
      transition: transform .13s, box-shadow .13s;
    }
    .lb-entry:hover {
      transform: translate(-3px,-2px);
      box-shadow: 7px 6px 0 #000C1A;
      border-color: rgba(56,189,248,.48);
    }

    .lb-rank-num {
      font-family: "Russo One", sans-serif;
      font-size: 1.2rem;
      color: #5A96B8;
      min-width: 32px;
      text-align: center;
    }

    .lb-avatar {
      width: 44px; height: 44px;
      border-radius: 999px;
      object-fit: cover;
      border: 2.5px solid rgba(56,189,248,.50);
      background: #07395C;
      box-shadow: 3px 3px 0 #000C1A;
      flex: 0 0 auto;
    }
    .lb-avatar-fallback {
      width: 44px; height: 44px;
      border-radius: 999px;
      border: 2.5px solid rgba(56,189,248,.50);
      background: #07395C;
      display: flex; align-items: center; justify-content: center;
      font-family: "Russo One", sans-serif;
      font-size: 1rem;
      color: #BAE6FD;
      box-shadow: 3px 3px 0 #000C1A;
      flex: 0 0 auto;
    }

    .lb-info { flex: 1; min-width: 0; }
    .lb-name {
      font-family: "Oxanium", sans-serif;
      font-weight: 800;
      font-size: .94rem;
      color: #EFF8FF;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-role {
      display: inline-flex;
      align-items: center;
      gap: .28rem;
      margin-top: .24rem;
      font-family: "Oxanium", sans-serif;
      font-weight: 700;
      font-size: .72rem;
      letter-spacing: .05em;
    }

    /* ================================================================
       STAFF OF THE MONTH
       ================================================================ */
    .sotm-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
      padding: 1.5rem 0;
      text-align: center;
      position: relative;
    }

    /* Animated glory ring */
    .sotm-glory {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sotm-ring {
      position: absolute;
      inset: -12px;
      border-radius: 999px;
      background: conic-gradient(
        from var(--spin-angle, 0deg),
        #FFD700, #FF6B6B, #A78BFA, #38BDF8, #34D399, #FFD700
      );
      animation: sotm-spin 4s linear infinite;
      filter: blur(2px);
    }
    @keyframes sotm-spin { to { transform: rotate(360deg); } }

    .sotm-ring-2 {
      position: absolute;
      inset: -6px;
      border-radius: 999px;
      border: 3px solid rgba(255,215,0,.50);
      box-shadow: 0 0 0 2px rgba(255,215,0,.22), inset 0 0 0 2px rgba(255,215,0,.10);
    }

    .sotm-avatar {
      width: 160px; height: 160px;
      border-radius: 999px;
      object-fit: cover;
      border: 5px solid #000C1A;
      position: relative;
      z-index: 1;
      box-shadow: 6px 6px 0 #000C1A;
    }
    .sotm-avatar-fallback {
      width: 160px; height: 160px;
      border-radius: 999px;
      border: 5px solid #000C1A;
      background: #07395C;
      display: flex; align-items: center; justify-content: center;
      font-family: "Russo One", sans-serif;
      font-size: 3.5rem;
      color: #BAE6FD;
      position: relative;
      z-index: 1;
      box-shadow: 6px 6px 0 #000C1A;
    }

    .sotm-crown {
      position: absolute;
      top: -44px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.8rem;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,.80));
      animation: crown-bob 2.4s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes crown-bob {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(-8px); }
    }

    .sotm-label {
      font-family: "Oxanium", sans-serif;
      font-weight: 800;
      font-size: .78rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #D97706;
    }

    .sotm-name {
      font-family: "Russo One", sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: #FDE68A;
      -webkit-text-stroke: 2px rgba(0,15,40,.95);
      paint-order: stroke fill;
      text-shadow: 0 4px 0 rgba(180,100,0,.80), 0 8px 0 rgba(100,50,0,.55);
    }

    .sotm-belt {
      display: flex;
      align-items: center;
      gap: .72rem;
      padding: .70rem 1.5rem;
      border-radius: 999px;
      border: 3px solid #D97706;
      background: linear-gradient(135deg, rgba(255,215,0,.18) 0%, rgba(217,119,6,.28) 100%);
      box-shadow: 5px 5px 0 rgba(80,30,0,.80), 0 0 24px rgba(255,215,0,.24);
      font-family: "Oxanium", sans-serif;
      font-weight: 800;
      font-size: .88rem;
      color: #FDE68A;
      letter-spacing: .08em;
    }

    /* Confetti particles for SOTM */
    .sotm-confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .sotm-confetti span {
      position: absolute;
      bottom: -10px;
      width: 6px; height: 6px;
      border-radius: 2px;
      opacity: 0;
      animation: confetti-fly var(--d, 6s) ease-in var(--del, 0s) infinite;
    }
    .sotm-confetti span:nth-child(odd) { border-radius: 999px; width: 5px; height: 5px; }
    .sotm-confetti span:nth-child(1)  { left:10%;  background:#FFD700; --d:6s;  --del:0s;   }
    .sotm-confetti span:nth-child(2)  { left:20%;  background:#FF6B6B; --d:7s;  --del:.8s;  }
    .sotm-confetti span:nth-child(3)  { left:30%;  background:#A78BFA; --d:5s;  --del:1.5s; }
    .sotm-confetti span:nth-child(4)  { left:40%;  background:#38BDF8; --d:8s;  --del:.3s;  }
    .sotm-confetti span:nth-child(5)  { left:50%;  background:#34D399; --d:6s;  --del:2.1s; }
    .sotm-confetti span:nth-child(6)  { left:60%;  background:#FFD700; --d:7s;  --del:1.1s; }
    .sotm-confetti span:nth-child(7)  { left:70%;  background:#F472B6; --d:5s;  --del:0.5s; }
    .sotm-confetti span:nth-child(8)  { left:80%;  background:#38BDF8; --d:9s;  --del:3.2s; }
    .sotm-confetti span:nth-child(9)  { left:15%;  background:#34D399; --d:7s;  --del:2.8s; }
    .sotm-confetti span:nth-child(10) { left:55%;  background:#FF6B6B; --d:6s;  --del:0.9s; }
    .sotm-confetti span:nth-child(11) { left:88%;  background:#A78BFA; --d:8s;  --del:4.0s; }
    .sotm-confetti span:nth-child(12) { left:45%;  background:#FDE68A; --d:5s;  --del:1.7s; }
    @keyframes confetti-fly {
      0%   { opacity:0; transform: translateY(0)    rotate(0deg)   scale(0); }
      15%  { opacity:1; transform: translateY(-60px) rotate(90deg)  scale(1); }
      80%  { opacity:.6; transform: translateY(-280px) rotate(360deg) scale(.7); }
      100% { opacity:0; transform: translateY(-420px) rotate(480deg) scale(0); }
    }

    .sotm-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #5A96B8;
      font-family: "Oxanium", sans-serif;
    }
    .sotm-empty-icon { font-size: 3rem; display: block; margin-bottom: .8rem; filter: drop-shadow(0 3px 0 rgba(0,0,0,.60)); }

    /* Empty leaderboard */
    .lb-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #5A96B8;
      font-family: "Oxanium", sans-serif;
    }

    /* Responsive */
    @media (max-width: 820px) {
      .hub-grid { grid-template-columns: repeat(2, 1fr); }
      .podium-row { flex-direction: column; align-items: center; }
      .podium-1st, .podium-2nd, .podium-3rd { order: unset; min-height: auto; width: 100%; max-width: 100%; }
    }
    @media (max-width: 500px) {
      .hub-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-route-page="/admin-hub.html">
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>

  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/#home">
        <img src="liquidicon.png" alt="Liquid Events logo">
        <span>Liquid Events</span>
      </a>
      <nav class="nav">
        <a href="https://www.liquidmc.net">Home</a>
        <a href="/#home" data-transition>Events</a>
        <a href="https://store.liquidmc.net">Store</a>
      </nav>
      <div class="top-actions">
        <a class="btn btn-small btn-secondary" href="https://discord.gg/liquidmc" target="_blank" rel="noopener noreferrer">Discord</a>
        <a class="btn btn-small btn-secondary" href="/#home" data-transition>Back</a>
      </div>
    </div>
  </header>

  <!-- AUTH GATE (hidden once verified) -->
  <div id="authGate" class="hub-gate container" hidden>
    <div class="glass hub-gate-card">
      <span id="gateIcon" class="hub-gate-icon">🔒</span>
      <h2 id="gateTitle">Checking Access…</h2>
      <p id="gateMsg" class="hero-text" style="margin-top:.6rem"></p>
      <a id="gateLoginBtn" class="btn btn-primary" style="margin-top:1.4rem;display:none" href="/api/discord-auth?action=login&returnTo=/%23admin-hub">Login with Discord</a>
    </div>
  </div>

  <!-- MAIN HUB (shown after auth passes) -->
  <main id="hubMain" hidden>
    <section class="section container section-top">
      <div class="section-head">
        <p class="eyebrow">Administration</p>
        <h1 class="page-title">Admin Hub</h1>
        <p class="hero-text">Logged in as <strong id="hubUserName" style="color:#38BDF8"></strong>
          <span id="hubRoleBadge" class="hero-stat-pill" style="margin-left:.6rem;vertical-align:middle"></span>

      <div class="hub-grid" id="hubGrid">

        <button class="hub-btn" onclick="window.location.href='/#review'">

          <span class="hub-btn-title">Review Applications</span>
          <span class="hub-btn-desc">View, accept, or deny pending staff and player applications.</span>
          <span class="hub-btn-arrow">→</span>
        </button>

        <!-- 2: Staff Guidebook -->
        <button class="hub-btn" onclick="window.location.href='/#staff-guide'">
          <span class="hub-btn-icon">📖</span>
          <span class="hub-btn-title">Staff Guidebook</span>
          <span class="hub-btn-desc">Full staff rules, punishment tables, and conduct policy.</span>
          <span class="hub-btn-arrow">→</span>
        </button>

        <!-- 3: Staff Leaderboard -->
        <button class="hub-btn" id="btnLeaderboard" onclick="togglePanel('leaderboard')">
          <span class="hub-btn-icon">🏆</span>
          <span class="hub-btn-title">Staff Leaderboard</span>
          <span class="hub-btn-desc">Ranked list of all staff members by Discord role.</span>
          <span class="hub-btn-arrow" id="arrowLeaderboard">↓</span>
        </button>

        <!-- 4: Staff of the Month -->
        <button class="hub-btn" id="btnSotm" onclick="togglePanel('sotm')">
          <span class="hub-btn-icon">⭐</span>
          <span class="hub-btn-title">Staff of the Month</span>
          <span class="hub-btn-desc">The current champion with the Staff of the Month role.</span>
          <span class="hub-btn-arrow" id="arrowSotm">↓</span>
        </button>

        <!-- 5–9: Coming Soon -->
        <button class="hub-btn" disabled>
          <span class="hub-btn-icon">🔒</span>
          <span class="hub-btn-title">Coming Soon</span>
          <span class="hub-btn-desc">This section is not yet available.</span>
        </button>
        <button class="hub-btn" disabled>
          <span class="hub-btn-icon">🔒</span>
          <span class="hub-btn-title">Coming Soon</span>
          <span class="hub-btn-desc">This section is not yet available.</span>
        </button>
        <button class="hub-btn" disabled>
          <span class="hub-btn-icon">🔒</span>
          <span class="hub-btn-title">Coming Soon</span>
          <span class="hub-btn-desc">This section is not yet available.</span>
        </button>
        <button class="hub-btn" disabled>
          <span class="hub-btn-icon">🔒</span>
          <span class="hub-btn-title">Coming Soon</span>
          <span class="hub-btn-desc">This section is not yet available.</span>
        </button>
        <button class="hub-btn" disabled>
          <span class="hub-btn-icon">🔒</span>
          <span class="hub-btn-title">Coming Soon</span>
          <span class="hub-btn-desc">This section is not yet available.</span>
        </button>
      </div>
    </section>

    <!-- ===== LEADERBOARD PANEL ===== -->
    <div id="panelLeaderboard" class="container" hidden>
      <div class="hub-panel">
        <div class="hub-panel-head">
          <div>
            <p class="eyebrow">Section 3</p>
            <h2>🏆 Staff Leaderboard</h2>
          </div>
          <button class="refresh-btn" id="refreshLeaderboard" onclick="loadLeaderboard(true)">
            <span class="refresh-icon">↻</span> Refresh
          </button>
        </div>
        <div class="hub-panel-body" id="leaderboardContent">
          <p class="panel-loading">Loading staff data…</p>
        </div>
      </div>
    </div>

    <!-- ===== STAFF OF THE MONTH PANEL ===== -->
    <div id="panelSotm" class="container" hidden>
      <div class="hub-panel">
        <div class="hub-panel-head">
          <div>
            <p class="eyebrow">Section 4</p>
            <h2>⭐ Staff of the Month</h2>
          </div>
          <button class="refresh-btn" id="refreshSotm" onclick="loadSotm(true)">
            <span class="refresh-icon">↻</span> Refresh
          </button>
        </div>
        <div class="hub-panel-body" id="sotmContent">
          <p class="panel-loading">Loading champion data…</p>
        </div>
      </div>
    </div>

    <div style="height:3rem"></div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>Liquid Events</p>
      <p><span id="year"></span> Minecraft Civilization Experiments</p>
    </div>
  </footer>

  <script src="site.js?v=20260519d"></script>
  <script>
  // ================================================================
  //  Admin Hub — auth + leaderboard + SOTM
  // ================================================================
  (function() {

    // All staff role IDs (any of these grants access)
    const STAFF_ROLE_IDS = new Set([
      "1437013714355228763",
      "1453087719482982491",
      "1446824077317640245",
      "1503462131209867364",
      "1504589647840542962",
      "1451316151429894155"
    ]);

    const ROLE_COLORS = {
      "1437013714355228763": "#FFD700",
      "1453087719482982491": "#FF6B6B",
      "1446824077317640245": "#FF8E53",
      "1503462131209867364": "#38BDF8",
      "1504589647840542962": "#A78BFA",
      "1451316151429894155": "#34D399"
    };

    const gate   = document.getElementById('authGate');
    const main   = document.getElementById('hubMain');
    const gateIcon  = document.getElementById('gateIcon');
    const gateTitle = document.getElementById('gateTitle');
    const gateMsg   = document.getElementById('gateMsg');
    const gateLogin = document.getElementById('gateLoginBtn');

    function showGate(icon, title, msg, showLogin, showRefresh) {
      gateIcon.textContent  = icon;
      gateTitle.textContent = title;
      gateMsg.textContent   = msg;
      gateLogin.style.display = showLogin ? '' : 'none';
      // Add/remove refresh button
      var existingRefresh = document.getElementById('gateRefreshBtn');
      if (existingRefresh) existingRefresh.remove();
      if (showRefresh) {
        var btn = document.createElement('button');
        btn.id = 'gateRefreshBtn';
        btn.className = 'btn btn-secondary';
        btn.style.cssText = 'margin-top:1rem;display:block;width:100%';
        btn.textContent = '🔄 Refresh Roles';
        btn.onclick = refreshRolesAndRetry;
        gateLogin.parentNode.appendChild(btn);
      }
      gate.hidden = false;
      main.hidden = true;
    }

    function showHub(me) {
      gate.hidden = true;
      main.hidden = false;
      const namEl = document.getElementById('hubUserName');
      const badgeEl = document.getElementById('hubRoleBadge');
      namEl.textContent = me.displayName || me.userId || '';
      if (me.highestRole) {
        badgeEl.textContent = me.highestRole.emoji + ' ' + me.highestRole.name;
        badgeEl.style.borderColor = me.highestRole.color + '88';
        badgeEl.style.background  = me.highestRole.color + '22';
        badgeEl.style.color       = me.highestRole.color;
      }
    }

    // ---- 3D tilt on all .glass and .hub-btn ----
    function applyTilt(el) {
      el.addEventListener('mousemove', function(e) {
        var r = el.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width  - 0.5;
        var y = (e.clientY - r.top)  / r.height - 0.5;
        el.style.transform  = 'perspective(700px) rotateY('+(x*12)+'deg) rotateX('+(-y*12)+'deg) translateZ(8px) translate(-2px,-3px)';
        el.style.transition = 'transform 0.08s ease';
      });
      el.addEventListener('mouseleave', function() {
        el.style.transform  = '';
        el.style.transition = 'transform 0.40s ease';
      });
    }

    // ---- Role refresh: re-fetches roles from Discord bot, updates cookie, then retries ----
    function refreshRolesAndRetry() {
      var btn = document.getElementById('gateRefreshBtn');
      if (btn) { btn.textContent = '⏳ Refreshing…'; btn.disabled = true; }
      fetch('/api/discord-auth?action=session&refreshRole=1', { credentials: 'include' })
        .then(function() { return checkAccess(); })
        .catch(function() {
          showGate('⚠️', 'Error', 'Could not refresh roles. Please try again.', false, true);
        });
    }

    // ---- Auth check ----
    function checkAccess() {
      return fetch('/api/discord-guild?action=me', { credentials: 'include' })
        .then(r => r.json())
        .then(data => {
          if (!data.ok && !data.isStaff) {
            // 401 — not logged in
            showGate('🔒', 'Staff Only', 'You need to be logged in with a staff Discord account to access the Admin Hub.', true, false);
            return;
          }
          if (!data.isStaff) {
            showGate('🚫', 'Access Denied', 'Your Discord account does not have a staff role. If you were just given a role, click Refresh Roles.', false, true);
            return;
          }
          showHub(data);
          document.querySelectorAll('.glass, .hub-btn:not([disabled])').forEach(applyTilt);
        })
        .catch(() => {
          showGate('⚠️', 'Error', 'Could not verify your access. Please refresh.', false, false);
        });
    }

    gate.hidden = false;
    main.hidden = true;
    showGate('⏳', 'Checking access…', '', false, false);
    checkAccess();

    // ---- Panel toggle ----
    var panelLeaderboard = document.getElementById('panelLeaderboard');
    var panelSotm        = document.getElementById('panelSotm');
    var lbLoaded  = false;
    var sotmLoaded = false;

    window.togglePanel = function(which) {
      var panel = which === 'leaderboard' ? panelLeaderboard : panelSotm;
      var arrow = document.getElementById('arrow' + (which === 'leaderboard' ? 'Leaderboard' : 'Sotm'));
      var btn   = document.getElementById('btn'   + (which === 'leaderboard' ? 'Leaderboard' : 'Sotm'));

      var isOpen = !panel.hidden;
      panel.hidden = isOpen;
      arrow.textContent = isOpen ? '↓' : '↑';
      btn.classList.toggle('hub-btn-active', !isOpen);

      if (!isOpen) {
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (which === 'leaderboard' && !lbLoaded) loadLeaderboard(false);
        if (which === 'sotm'        && !sotmLoaded) loadSotm(false);
      }
    };

    // ---- Leaderboard ----
    window.loadLeaderboard = function(forced) {
      var container = document.getElementById('leaderboardContent');
      var btn       = document.getElementById('refreshLeaderboard');
      if (!forced && lbLoaded) return;

      container.innerHTML = '<p class="panel-loading">Fetching staff data from Discord…</p>';
      btn.classList.add('spinning');

      fetch('/api/discord-guild?action=leaderboard', { credentials: 'include' })
        .then(r => r.json())
        .then(data => {
          btn.classList.remove('spinning');
          if (!data.ok) { container.innerHTML = '<p class="panel-error">Error: ' + escHtml(data.error || 'Unknown error') + '</p>'; return; }
          lbLoaded = true;
          renderLeaderboard(data.leaderboard || [], container);
        })
        .catch(() => {
          btn.classList.remove('spinning');
          container.innerHTML = '<p class="panel-error">Network error. Please try again.</p>';
        });
    };

    function renderLeaderboard(list, container) {
      if (!list.length) {
        container.innerHTML = '<div class="lb-empty"><span style="font-size:2.5rem;display:block;margin-bottom:.8rem;filter:drop-shadow(0 3px 0 rgba(0,0,0,.60))">📭</span>No staff members found.</div>';
        return;
      }

      var top3  = list.slice(0, 3);
      var rest  = list.slice(3);
      var html  = '';

      // Podium (top 3)
      html += '<div class="podium-row">';
      var order = top3.length >= 3 ? [1, 0, 2] : top3.map((_, i) => i); // 2nd, 1st, 3rd visual order
      var classes = ['podium-2nd', 'podium-1st', 'podium-3rd'];
      var crowns  = ['🥈', '👑', '🥉'];

      order.forEach(function(idx) {
        if (idx >= top3.length) return;
        var m      = top3[idx];
        var cls    = classes[order.indexOf(idx)];
        var crown  = crowns[order.indexOf(idx)];
        var color  = m.highestRole ? m.highestRole.color : '#38BDF8';
        var rankNum = idx + 1;

        html += '<div class="podium-card ' + cls + '">';
        html += '<div class="podium-rank-badge">#' + rankNum + '</div>';
        html += '<span class="podium-crown">' + crown + '</span>';

        if (m.avatar) {
          html += '<img class="podium-avatar" src="' + escHtml(m.avatar) + '" alt="' + escHtml(m.displayName) + '" onerror="this.parentNode.replaceChild(Object.assign(document.createElement(\'div\'), {className:\'podium-avatar-fallback\', textContent:\'' + initials(m.displayName) + '\'}), this)">';
        } else {
          html += '<div class="podium-avatar-fallback">' + escHtml(initials(m.displayName)) + '</div>';
        }

        html += '<span class="podium-name">' + escHtml(m.displayName) + '</span>';
        if (m.highestRole) {
          html += '<span class="podium-role-badge" style="border-color:' + color + '66;color:' + color + ';background:' + color + '18">' + escHtml(m.highestRole.emoji) + ' ' + escHtml(m.highestRole.name) + '</span>';
        }
        html += '</div>';
      });
      html += '</div>';

      // Rest of list
      if (rest.length) {
        html += '<div class="lb-list">';
        rest.forEach(function(m, i) {
          var rank  = i + 4;
          var color = m.highestRole ? m.highestRole.color : '#38BDF8';
          html += '<div class="lb-entry">';
          html += '<span class="lb-rank-num">' + rank + '</span>';
          if (m.avatar) {
            html += '<img class="lb-avatar" src="' + escHtml(m.avatar) + '" alt="' + escHtml(m.displayName) + '" onerror="this.style.display=\'none\'">';
          } else {
            html += '<div class="lb-avatar-fallback">' + escHtml(initials(m.displayName)) + '</div>';
          }
          html += '<div class="lb-info">';
          html += '<div class="lb-name">' + escHtml(m.displayName) + '</div>';
          if (m.highestRole) {
            html += '<div class="lb-role" style="color:' + color + '">' + escHtml(m.highestRole.emoji) + ' ' + escHtml(m.highestRole.name) + '</div>';
          }
          html += '</div></div>';
        });
        html += '</div>';
      }

      container.innerHTML = html;

      // Apply 3D tilt to podium cards + list entries
      container.querySelectorAll('.podium-card, .lb-entry').forEach(function(el) {
        el.addEventListener('mousemove', function(e) {
          var r = el.getBoundingClientRect();
          var x = (e.clientX - r.left) / r.width  - 0.5;
          var y = (e.clientY - r.top)  / r.height - 0.5;
          el.style.transform  = 'perspective(600px) rotateY('+(x*10)+'deg) rotateX('+(-y*10)+'deg) translateZ(8px) translateY(-4px)';
          el.style.transition = 'transform 0.08s ease';
        });
        el.addEventListener('mouseleave', function() {
          el.style.transform  = '';
          el.style.transition = 'transform 0.40s ease';
        });
      });
    }

    // ---- Staff of the Month ----
    window.loadSotm = function(forced) {
      var container = document.getElementById('sotmContent');
      var btn       = document.getElementById('refreshSotm');
      if (!forced && sotmLoaded) return;

      container.innerHTML = '<p class="panel-loading">Fetching champion data from Discord…</p>';
      btn.classList.add('spinning');

      fetch('/api/discord-guild?action=sotm', { credentials: 'include' })
        .then(r => r.json())
        .then(data => {
          btn.classList.remove('spinning');
          if (!data.ok) { container.innerHTML = '<p class="panel-error">Error: ' + escHtml(data.error || 'Unknown error') + '</p>'; return; }
          sotmLoaded = true;
          renderSotm(data.members || [], container);
        })
        .catch(() => {
          btn.classList.remove('spinning');
          container.innerHTML = '<p class="panel-error">Network error. Please try again.</p>';
        });
    };

    function renderSotm(members, container) {
      if (!members.length) {
        container.innerHTML = '<div class="sotm-empty"><span class="sotm-empty-icon">🏅</span><h3 style="margin:.5rem 0">No Champion Yet</h3><p class="hero-text">No one has the Staff of the Month role right now.</p></div>';
        return;
      }

      var html = '';
      members.forEach(function(m) {
        html += '<div class="sotm-wrap">';
        // confetti
        html += '<div class="sotm-confetti">';
        for (var i = 0; i < 12; i++) html += '<span></span>';
        html += '</div>';

        html += '<p class="sotm-label">⭐ Staff of the Month ⭐</p>';

        // glory avatar
        html += '<div class="sotm-glory">';
        html += '<div class="sotm-ring"></div>';
        html += '<div class="sotm-ring-2"></div>';
        html += '<span class="sotm-crown">👑</span>';
        if (m.avatar) {
          html += '<img class="sotm-avatar" src="' + escHtml(m.avatar) + '" alt="' + escHtml(m.displayName) + '" onerror="this.parentNode.querySelector(\'.sotm-avatar-fallback\').style.display=\'flex\';this.style.display=\'none\'">';
          html += '<div class="sotm-avatar-fallback" style="display:none">' + escHtml(initials(m.displayName)) + '</div>';
        } else {
          html += '<div class="sotm-avatar-fallback">' + escHtml(initials(m.displayName)) + '</div>';
        }
        html += '</div>';

        html += '<p class="sotm-name">' + escHtml(m.displayName) + '</p>';
        html += '<div class="sotm-belt">🏆 &nbsp;Liquid Events Champion&nbsp; 🏆</div>';
        html += '</div>';
      });

      container.innerHTML = html;
    }

    // ---- Utils ----
    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function initials(name) {
      var parts = String(name || '?').trim().split(/\s+/);
      return parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : (parts[0][0] || '?').toUpperCase();
    }

  })();
  </script>
</body>
</html>
